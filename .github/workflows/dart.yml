name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods
        run: pod repo update
        working-directory: ios

      # Decode certificate
      - name: Decode Certificate
        run: |
          echo "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12

      # Decode provisioning profile
      - name: Decode Provisioning Profile
        run: |
          echo "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

      # Create keychain
      - name: Create Keychain
        run: |
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      # Import certificate
      - name: Import Certificate
        run: |
          security import certificate.p12 \
          -k build.keychain \
          -P "${{ secrets.P12_PASSWORD }}" \
          -T /usr/bin/codesign

      # Install provisioning profile
      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision \
          ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # Build IPA
      - name: Build IPA
        run: |
          flutter build ipa \
          --release \
          --export-options-plist=ios/exportOptions.plist

      # Upload IPA Artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa